[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-urdu-nlp"
version = "0.1.0"
description = "A pipeline for normalizing, transliterating, and translating Roman Urdu text."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "regex>=2023.0",
    "deep-translator>=1.11",
    "editdistance>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roman_urdu_nlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
